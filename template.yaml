AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PriceCompare API (Products + Compare only)

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: dotnet10
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev or prod)
    Default: dev
    AllowedValues:
      - dev
      - prod
  DbConnectionString:
    Type: String
    Description: >-
      PostgreSQL connection string for AppDbContext (Npgsql). Use Supavisor transaction mode
      (Port=6543;Pooling=false;No Reset On Close=true): every Lambda instance keeps its own
      client-side pool, so session mode (5432) runs out of connections under concurrency
      (XX000 EMAXCONNSESSION). DbConnectionStringNormalizer caps the pool if pooling is left on.
  EmailHost:
    Type: String
  EmailPort:
    Type: Number
    Default: 587
  EmailUseSsl:
    Type: String
    Default: "false"
  EmailUsername:
    Type: String
  EmailPassword:
    Type: String
    NoEcho: true
  EmailFromEmail:
    Type: String
  EmailFromName:
    Type: String
    Default: "PriceCompare"
  FavoriteAlertsBaseUrl:
    Type: String
    Default: "https://www.price-peer.com"
  FavoriteAlertsPath:
    Type: String
    Default: "/favorites"
  JwtSecretId:
    Type: String
    Description: Secrets Manager secret name or ARN for JwtSettings__Secret
  OpenRouterApiKeySecretId:
    Type: String
    Description: Secrets Manager secret name or ARN for OpenRouter__ApiKey
  RedisConnectionString:
    Type: String
    Description: StackExchange.Redis connection string for IDistributedCache (AI search rate limiting)
    Default: ""
    NoEcho: true
  CognitoRegion:
    Type: String
    Default: "ap-southeast-2"
  CognitoUserPoolId:
    Type: String
  CognitoAppClientId:
    Type: String
  AdminEmails:
    Type: String
    Description: Comma-separated list of admin emails
    Default: ""
  ApiWarmupEnabled:
    Type: String
    Description: >-
      Keep one API instance and the default products cache entry warm with a scheduled ping every
      5 minutes. Cold starts cost 3-6s on first request, and at this traffic level nearly every
      visit hits one (BTS-154).
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  ApiWarmupOn: !Equals [ !Ref ApiWarmupEnabled, "true" ]

Resources:
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "https://www.price-peer.com"
          - "https://price-peer.com"
          - "http://pricecompare-frontend-prod.s3-website-ap-southeast-2.amazonaws.com"
          - "http://pricecompare-frontend-dev.s3-website-ap-southeast-2.amazonaws.com"
          - "http://localhost:3000"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pricecompare-frontend-${Environment}"

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pricecompare-receipts-${Environment}"

  PriceCompareApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "price-compare-api-${Environment}"
      Handler: PriceCompareWeb
      CodeUri: ./src/PriceCompareWeb/
      PackageType: Zip
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptsBucket
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectText
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:ListSchedules
                - scheduler:GetSchedule
              Resource: "*"
      Events:
        ReceiptsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts
            Method: GET
        ReceiptsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts
            Method: POST
        ReceiptDetailGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}
            Method: GET
        ReceiptUploadPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}/upload
            Method: POST
        ReceiptItemsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}/items
            Method: PUT
        ReceiptsDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}
            Method: DELETE
        ReceiptUploadAndParsePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/upload-and-parse
            Method: POST
        ProductsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Products
            Method: GET
        CompareGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Compare
            Method: GET
        MatchRunPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/run
            Method: POST
        MatchStatusGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/status/{jobId}
            Method: GET
        MatchJobsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/jobs
            Method: GET
        MatchProductMatchesReviewGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/productmatches/review
            Method: GET
        MatchProductMatchesUpdatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/productmatches/update
            Method: POST
        CompareCachedGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/compare-cached
            Method: GET
        CompareCachedByProductGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/compare-cached/by-product
            Method: GET
        CompareCachedByProductsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/compare-cached/by-products
            Method: POST
        PriceHistoryGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Products/priceHistory
            Method: GET
        ProductsSearchByDescriptionPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Products/search-by-description
            Method: POST
        AuthLoginPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/login
            Method: POST
        AuthRegisterPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/register
            Method: POST
        AuthVerifyEmailPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/verify-email
            Method: POST
        FavoritesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites
            Method: GET
        FavoritesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: POST
        FavoritesDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: DELETE
        FavoritesPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: PUT
        AdminWhoAmIGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/whoami
            Method: GET
        AdminSchedulesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/schedules
            Method: GET
        AdminHealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/health
            Method: GET
        AdminRunsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/schedules/{jobName}/runs
            Method: GET
        AdminStatsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/schedules/{jobName}/stats
            Method: GET
        AdminPriceHistoryCleanupPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/pricehistory/cleanup
            Method: POST
      Environment:
        Variables:
          ConnectionStrings__DefaultConnection: !Ref DbConnectionString
          Aws__ReceiptBucket: !Ref ReceiptsBucket
          DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
          JwtSettings__Secret: !Sub "{{resolve:secretsmanager:${JwtSecretId}:SecretString}}"
          OpenRouter__ApiKey: !Sub "{{resolve:secretsmanager:${OpenRouterApiKeySecretId}:SecretString}}"
          Redis__ConnectionString: !Ref RedisConnectionString
          Cognito__Region: !Ref CognitoRegion
          Cognito__UserPoolId: !Ref CognitoUserPoolId
          Cognito__AppClientId: !Ref CognitoAppClientId
          AdminEmails: !Ref AdminEmails
          Scraping__EnableQuartz: "false"
          Cache__Environment: !Ref Environment

  # BTS-154: invoke the API Lambda directly (not through API Gateway) with a synthetic
  # HTTP API v2 event for GET /api/Products?page=1&pageSize=20 — the same request, and the same
  # cache key, the frontend issues on landing.
  ApiWarmupSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ApiWarmupOn
    Properties:
      Name: !Sub "price-compare-${Environment}-api-warmup"
      ScheduleExpression: "rate(5 minutes)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PriceCompareApi.Arn
        RoleArn: !GetAtt ApiWarmupScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0
        Input: |
          {
            "version": "2.0",
            "routeKey": "GET /api/Products",
            "rawPath": "/api/Products",
            "rawQueryString": "page=1&pageSize=20",
            "headers": {
              "host": "warmup.internal",
              "x-forwarded-proto": "https",
              "user-agent": "price-compare-warmer"
            },
            "queryStringParameters": { "page": "1", "pageSize": "20" },
            "requestContext": {
              "routeKey": "GET /api/Products",
              "stage": "$default",
              "requestId": "warmup",
              "http": {
                "method": "GET",
                "path": "/api/Products",
                "protocol": "HTTP/1.1",
                "sourceIp": "127.0.0.1",
                "userAgent": "price-compare-warmer"
              }
            },
            "isBase64Encoded": false
          }

  ApiWarmupScheduleRole:
    Type: AWS::IAM::Role
    Condition: ApiWarmupOn
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeApiWarmup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PriceCompareApi.Arn

  FavoritePriceTrackingJob:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "price-track-${Environment}"
      Handler: PriceCompareWeb::PriceCompareWeb.LambdaEntryPoint::FunctionHandlerAsync
      CodeUri: ./src/PriceCompareWeb/
      PackageType: Zip
      Environment:
        Variables:
          TARGET_JOB: FAVORITE_TRACK
          ConnectionStrings__DefaultConnection: !Ref DbConnectionString
          DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
          Email__Host: !Ref EmailHost
          Email__Port: !Ref EmailPort
          Email__UseSsl: !Ref EmailUseSsl
          Email__Username: !Ref EmailUsername
          Email__Password: !Ref EmailPassword
          Email__FromEmail: !Ref EmailFromEmail
          Email__FromName: !Ref EmailFromName
          FavoriteAlerts__BaseUrl: !Ref FavoriteAlertsBaseUrl
          FavoriteAlerts__FavoritesPath: !Ref FavoriteAlertsPath
          SCHEDULE_NAME: !Sub "price-compare-${Environment}-favorite-price-tracking"

  FavoritePriceTrackingScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeFavoritePriceTracking
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt FavoritePriceTrackingJob.Arn

  FavoritePriceTrackingSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "price-compare-${Environment}-favorite-price-tracking"
      ScheduleExpression: "cron(55 6 ? * WED *)"
      ScheduleExpressionTimezone: "Australia/Sydney"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt FavoritePriceTrackingJob.Arn
        RoleArn: !GetAtt FavoritePriceTrackingScheduleRole.Arn

Outputs:
  FrontendBucketName:
    Description: S3 bucket for frontend static hosting
    Value: !Ref FrontendBucket
  ReceiptsBucketName:
    Description: S3 bucket for receipt images
    Value: !Ref ReceiptsBucket
  ApiEndpoint:
    Description: HTTP API invoke URL (no stage path)
    Value: !Sub "https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
