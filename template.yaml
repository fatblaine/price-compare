AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PriceCompare API (Products + Compare only)

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: dotnet8
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev or prod)
    Default: dev
    AllowedValues:
      - dev
      - prod
  DbConnectionString:
    Type: String
    Description: PostgreSQL connection string for AppDbContext (Npgsql)
  EmailHost:
    Type: String
  EmailPort:
    Type: Number
    Default: 587
  EmailUseSsl:
    Type: String
    Default: "false"
  EmailUsername:
    Type: String
  EmailPassword:
    Type: String
    NoEcho: true
  EmailFromEmail:
    Type: String
  EmailFromName:
    Type: String
    Default: "PriceCompare"
  FavoriteAlertsBaseUrl:
    Type: String
  FavoriteAlertsPath:
    Type: String
    Default: "/"
  JwtSecretId:
    Type: String
    Description: Secrets Manager secret name or ARN for JwtSettings__Secret
  OpenRouterApiKeySecretId:
    Type: String
    Description: Secrets Manager secret name or ARN for OpenRouter__ApiKey
  AdminEmails:
    Type: String
    Description: Comma-separated list of admin emails
    Default: ""

Resources:
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pricecompare-frontend-${Environment}"

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pricecompare-receipts-${Environment}"

  PriceCompareApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "price-compare-api-${Environment}"
      Handler: PriceCompareWeb
      CodeUri: ./src/PriceCompareWeb/
      PackageType: Zip
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptsBucket
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectText
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:ListSchedules
                - scheduler:GetSchedule
              Resource: "*"
      Events:
        ReceiptsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts
            Method: GET
        ReceiptsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts
            Method: POST
        ReceiptDetailGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}
            Method: GET
        ReceiptUploadPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}/upload
            Method: POST
        ReceiptItemsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}/items
            Method: PUT
        ReceiptUploadAndParsePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/upload-and-parse
            Method: POST
        ProductsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Products
            Method: GET
        CompareGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Compare
            Method: GET
        MatchRunPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/run
            Method: POST
        MatchStatusGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Match/status/{jobId}
            Method: GET
        CompareCachedGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/compare-cached
            Method: GET
        CompareCachedByProductGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/compare-cached/by-product
            Method: GET
        PriceHistoryGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Scraping/priceHistory
            Method: GET
        AuthLoginPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/login
            Method: POST
        AuthRegisterPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/register
            Method: POST
        FavoritesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites
            Method: GET
        FavoritesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: POST
        FavoritesDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: DELETE
        FavoritesPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: PUT
        AdminSchedulesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/schedules
            Method: GET
        AdminHealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/health
            Method: GET
        AdminRunsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/schedules/{jobName}/runs
            Method: GET
        AdminStatsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/admin/schedules/{jobName}/stats
            Method: GET
      Environment:
        Variables:
          ConnectionStrings__DefaultConnection: !Ref DbConnectionString
          Aws__ReceiptBucket: !Ref ReceiptsBucket
          DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
          JwtSettings__Secret: !Sub "{{resolve:secretsmanager:${JwtSecretId}:SecretString}}"
          OpenRouter__ApiKey: !Sub "{{resolve:secretsmanager:${OpenRouterApiKeySecretId}:SecretString}}"
          AdminEmails: !Ref AdminEmails

  FavoritePriceTrackingJob:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "price-track-${Environment}"
      Handler: PriceCompareWeb::PriceCompareWeb.LambdaEntryPoint::FunctionHandlerAsync
      CodeUri: ./src/PriceCompareWeb/
      PackageType: Zip
      Environment:
        Variables:
          TARGET_JOB: FAVORITE_TRACK
          ConnectionStrings__DefaultConnection: !Ref DbConnectionString
          DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
          Email__Host: !Ref EmailHost
          Email__Port: !Ref EmailPort
          Email__UseSsl: !Ref EmailUseSsl
          Email__Username: !Ref EmailUsername
          Email__Password: !Ref EmailPassword
          Email__FromEmail: !Ref EmailFromEmail
          Email__FromName: !Ref EmailFromName
          FavoriteAlerts__BaseUrl: !Ref FavoriteAlertsBaseUrl
          FavoriteAlerts__FavoritesPath: !Ref FavoriteAlertsPath
          SCHEDULE_NAME: !Sub "price-compare-${Environment}-favorite-price-tracking"

  FavoritePriceTrackingScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeFavoritePriceTracking
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt FavoritePriceTrackingJob.Arn

  FavoritePriceTrackingSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "price-compare-${Environment}-favorite-price-tracking"
      ScheduleExpression: "cron(10 6 ? * TUE *)"
      ScheduleExpressionTimezone: "Australia/Sydney"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt FavoritePriceTrackingJob.Arn
        RoleArn: !GetAtt FavoritePriceTrackingScheduleRole.Arn

Outputs:
  FrontendBucketName:
    Description: S3 bucket for frontend static hosting
    Value: !Ref FrontendBucket
  ReceiptsBucketName:
    Description: S3 bucket for receipt images
    Value: !Ref ReceiptsBucket
  ApiEndpoint:
    Description: HTTP API invoke URL (no stage path)
    Value: !Sub "https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
