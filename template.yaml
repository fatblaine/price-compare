AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PriceCompare API (Products + Compare only)

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: dotnet8
    Architectures:
      - x86_64

Parameters:
  DbConnectionString:
    Type: String
    Description: PostgreSQL connection string for AppDbContext (Npgsql)

Resources:
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"

  PriceCompareApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PriceCompareApi
      Handler: PriceCompareWeb
      CodeUri: ./src/PriceCompareWeb/
      PackageType: Zip
      Events:
        ProductsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Products
            Method: GET
        CompareGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Compare
            Method: GET
        PriceHistoryGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Scraping/priceHistory
            Method: GET
        AuthLoginPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/login
            Method: POST
        AuthRegisterPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/register
            Method: POST
      Environment:
        Variables:
          ConnectionStrings__DefaultConnection: !Ref DbConnectionString

Outputs:
  ApiEndpoint:
    Description: HTTP API invoke URL (no stage path)
    Value: !Sub "https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
