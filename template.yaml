AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PriceCompare API (Products + Compare only)

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: dotnet8
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev or prod)
    Default: dev
    AllowedValues:
      - dev
      - prod
  DbConnectionString:
    Type: String
    Description: PostgreSQL connection string for AppDbContext (Npgsql)

Resources:
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pricecompare-frontend-${Environment}"

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pricecompare-receipts-${Environment}"

  PriceCompareApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "price-compare-api-${Environment}"
      Handler: PriceCompareWeb
      CodeUri: ./src/PriceCompareWeb/
      PackageType: Zip
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptsBucket
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectText
              Resource: "*"
      Events:
        ReceiptsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts
            Method: GET
        ReceiptsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts
            Method: POST
        ReceiptDetailGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}
            Method: GET
        ReceiptUploadPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}/upload
            Method: POST
        ReceiptItemsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/{id}/items
            Method: PUT
        ReceiptUploadAndParsePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Receipts/upload-and-parse
            Method: POST
        ProductsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Products
            Method: GET
        CompareGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Compare
            Method: GET
        PriceHistoryGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Scraping/priceHistory
            Method: GET
        AuthLoginPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/login
            Method: POST
        AuthRegisterPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Auth/register
            Method: POST
        FavoritesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites
            Method: GET
        FavoritesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: POST
        FavoritesDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: DELETE
        FavoritesPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppHttpApi
            Path: /api/Favorites/{productId}
            Method: PUT
      Environment:
        Variables:
          ConnectionStrings__DefaultConnection: !Ref DbConnectionString
          Aws__ReceiptBucket: !Ref ReceiptsBucket

Outputs:
  FrontendBucketName:
    Description: S3 bucket for frontend static hosting
    Value: !Ref FrontendBucket
  ReceiptsBucketName:
    Description: S3 bucket for receipt images
    Value: !Ref ReceiptsBucket
  ApiEndpoint:
    Description: HTTP API invoke URL (no stage path)
    Value: !Sub "https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
